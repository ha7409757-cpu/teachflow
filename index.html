  <body class="bg-emerald-950 text-emerald-50 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #022c22; color: white; font-family: sans-serif;">
        <div style="text-align: center;">
          <h1 style="margin-bottom: 10px;">TeachFlow</h1>
          <p>Loading application...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('TeachFlow ServiceWorker registered successfully with scope: ', registration.scope);
          }, function(err) {
            console.log('TeachFlow ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
